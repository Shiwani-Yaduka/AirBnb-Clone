services:
  - type: web
    name: airbnb-clone-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # No persistent disk: Render's free plan doesn't support one. The SQLite file
    # lives in the container's ephemeral filesystem and resets on redeploy/restart.
    # PUBLIC_URL + keep_alive.py stop the free-tier 15-min idle spin-down from
    # triggering that reset during normal use, but a real redeploy still wipes it.
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/airbnb_clone.db
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://airbnbscalershiwani.vercel.app"]'
      - key: PUBLIC_URL
        value: https://airbnb-clone-backend-dkav.onrender.com
      # Server-side Clerk key (dashboard.clerk.com -> API Keys), same instance as the
      # frontend's publishable key. Not stored here - set it manually in the Render
      # dashboard after the service exists. Without it every authenticated request
      # (login sync, bookings, become-host, ...) silently no-ops instead of erroring.
      - key: CLERK_SECRET_KEY
        sync: false
